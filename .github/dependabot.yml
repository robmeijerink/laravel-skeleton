version: 2
updates:
  # PHP minor in the dev image (ARG PHP_VERSION) and the production image: a bump PR shows in CI
  # whether the new PHP works, so nobody has to remember to look.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
