version: 2
updates:
  # PHP minor in the dev image (ARG PHP_VERSION) and the production image: a bump PR shows in CI
  # whether the new PHP works, so nobody has to remember to look.
  # Dependabot reads the PHP version from .devcontainer/Dockerfile only: the FrankenPHP tag in Dockerfile
  # (1-php8.5-trixie) is not recognised. CI fails until you update that line by hand in the PR.
  - package-ecosystem: docker
    directories: ["/", "/.devcontainer"]
    schedule:
      interval: weekly
    groups:
      php:
        patterns: ["php", "dunglas/frankenphp"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
