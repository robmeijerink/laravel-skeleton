name: Skeleton smoke test

# The template contains no Laravel code: `task init` fetches the newest installer and starter kits.
# So the template can break without a single commit here. This builds every variant on every push
# to main, on every pull request and weekly, and shows when an upstream change (installer flags, a
# starter kit, a PHP release) needs attention.
# Removed by `task init` in generated projects.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant:
    name: ${{ matrix.flags }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - --react --mailpit --redis
          - --vue --no-auth
          - --livewire --filament
          - --livewire --no-auth
          - --blade
          - --spa-react
          - --spa-vue
    steps:
      - uses: actions/checkout@v7
      # Dependabot bumps PHP in .devcontainer/Dockerfile but cannot read the FrankenPHP tag in Dockerfile
      # (1-php8.5-trixie), so a PHP bump needs that line changed by hand. This makes sure it is not forgotten.
      - name: PHP versions match
        run: |
          dev=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+).*/\1/p' .devcontainer/Dockerfile)
          prod=$(sed -nE 's/^FROM dunglas\/frankenphp:[0-9]+-php([0-9]+\.[0-9]+).*/\1/p' Dockerfile)
          if [ -z "$dev" ] || [ "$dev" != "$prod" ]; then
            echo "::error file=Dockerfile::PHP is '$dev' in .devcontainer/Dockerfile but '$prod' in Dockerfile. Change the first FROM line in Dockerfile to: FROM dunglas/frankenphp:1-php$dev-trixie AS base"
            exit 1
          fi
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task init -- ${{ matrix.flags }} --name=smoke
      - run: task check
      # The same steps as the generated project's CI (.skeleton/ci.yml), in a fresh Compose project with
      # empty volumes, like on a CI runner. Keep in sync with that file.
      - name: Project CI
        run: |
          docker compose -f .devcontainer/docker-compose.yml -p smoke-ci run --rm -T app sh -euc '
            git config --global --add safe.directory "$PWD"
            composer install --no-interaction --no-progress
            if [ -f package.json ]; then bun install --frozen-lockfile && bun run build; fi
            composer qa:ci
          '
      - run: docker build .
