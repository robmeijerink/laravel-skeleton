name: Dependabot auto-merge

# Keeps maintenance near zero: Dependabot PRs (minor and patch, including the PHP minor in the
# Dockerfiles) merge on their own as soon as CI is green. A failing PR stays open for you to look at.
# Needs: repo setting "Allow auto-merge", and a branch protection rule on main that requires
# the CI checks (otherwise --auto merges immediately).
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major versions need a human
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
