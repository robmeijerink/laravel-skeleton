version: "3"

includes:
  local:
    taskfile: Taskfile.local.yml
    optional: true

vars:
  COMPOSE: docker compose -f .devcontainer/docker-compose.yml
  APP: "{{.COMPOSE}} run --rm app"

# Unique Compose project per checkout (matches the name VS Code Dev Containers uses)
env:
  COMPOSE_PROJECT_NAME: '{{regexReplaceAll "[^a-z0-9_-]" (lower (base .ROOT_DIR)) ""}}_devcontainer'
  # Sandbox user: your uid on Linux so it can write to the project; 1000 on macOS (bind mounts
  # ignore it there, and a change would lock the existing agent volumes). Never root.
  AGENT_UID:
    sh: '[ "$(uname -s)" = Linux ] && [ "$(id -u)" != 0 ] && id -u || echo 1000'

tasks:
  # ==========================================
  # 💻 SYSTEM
  # ==========================================
  default:
    desc: Open the interactive task menu
    silent: true
    cmds:
      - task: search

  search:
    desc: Open the interactive task menu
    silent: true
    cmds:
      - |
        CHOICE=$(task --list | grep '^\*' | grep -vE 'default|search' | fzf --reverse --border="rounded" --prompt="🚀 Search Task: " --pointer="👉")
        if [ -n "$CHOICE" ]; then
          TASK_NAME=$(echo "$CHOICE" | awk '{print $2}' | sed 's/:$//')
          echo -e "\033[1;32mRunning:\033[0m task $TASK_NAME\n"
          task "$TASK_NAME"
        fi

  volumes:
    desc: Create the Composer and Bun cache volumes shared by all projects
    internal: true
    silent: true
    run: once
    cmds:
      - docker volume create php_composer > /dev/null
      - docker volume create bun_cache > /dev/null

  # >>> skeleton
  init:
    desc: Create the Laravel app (wizard; or task init -- --help for the flags)
    deps: [volumes]
    interactive: true
    cmds:
      - .skeleton/init.sh {{.CLI_ARGS}}
  # <<< skeleton

  # ==========================================
  # 🚀 MAIN
  # ==========================================
  agent:prepare:
    desc: Create what the sandbox mounts if it doesn't exist yet
    internal: true
    silent: true
    cmds:
      # Mounted read-only, so it must exist as a file (Docker would create a directory); a bare version line is a valid Taskfile
      - '[ -e Taskfile.local.yml ] || printf "version: \"3\"\\n" > Taskfile.local.yml'
      - docker volume create ai-skills-provider > /dev/null
      - docker volume create ai-instructions-provider > /dev/null
      # Only if you opted in to .secrets/ (it has files; the empty folder is created by the sandbox's mount):
      # warn about .env files the agent can still read. A hint, not a guarantee (see "Secrets" in
      # docs/decisions/002-agent-sandbox.md). -type f skips the symlinks; files tracked by git
      # (.env.example, the committed .env.testing) are not secret, so they are skipped.
      - |
        [ -n "$(ls -A .secrets 2> /dev/null)" ] || exit 0
        files=$(find . \( -path ./vendor -o -path ./.git -o -path ./node_modules -o -path ./.secrets \) -prune \
          -o -type f \( -name '.env' -o -name '.env.*' -o -name '*.env' \) -print \
          | while IFS= read -r f; do git ls-files --error-unmatch -- "$f" > /dev/null 2>&1 || echo "$f"; done)
        if [ -n "$files" ]; then
          echo "Warning: the agent can read these .env files (not symlinked into .secrets/):" >&2
          echo "$files" | sed 's|^\./|  |' >&2
        fi

  agent:
    desc: Start Claude Code in the sandbox (task agent -- <claude args>)
    deps: [agent:prepare]
    cmds:
      - "{{.COMPOSE}} up -d --build agent"
      - "{{.COMPOSE}} exec agent claude {{.CLI_ARGS}}"

  agent:update:
    desc: Rebuild the sandbox with the latest Claude Code
    deps: [agent:prepare]
    cmds:
      - "{{.COMPOSE}} build --pull --no-cache agent"
      - "{{.COMPOSE}} up -d --force-recreate agent"

  dev:
    desc: Start the app, queue worker, logs and Vite with hot reloading
    deps: [volumes]
    cmds:
      - "{{.COMPOSE}} up"

  down:
    desc: Stop the dev containers
    cmds:
      - "{{.COMPOSE}} down"

  test:
    desc: Run the Pest tests (task test -- --filter=Foo)
    deps: [volumes]
    cmds:
      - "{{.APP}} vendor/bin/pest {{.CLI_ARGS}}"

  check:
    desc: Pun (formats and fixes, then analyses at max), frontend checks, Pest and type coverage
    silent: true
    # One container and quiet output: this is the feedback loop for AI agents, every line costs tokens.
    # Formats instead of only checking, so agents never spend a round trip on formatting (CI still checks).
    deps: [volumes]
    cmds:
      - "{{.COMPOSE}} --progress quiet run --rm app sh -c 'composer qa'"

  fmt:
    desc: Format the code with Pun
    deps: [volumes]
    cmds:
      - "{{.APP}} vendor/bin/pun format"

  artisan:
    desc: Run any artisan command (task artisan -- make:model Post -m)
    deps: [volumes]
    cmds:
      - "{{.APP}} php artisan {{.CLI_ARGS}}"

  pun:
    desc: Run any Pun command, e.g. packages (task pun -- require spatie/laravel-data)
    deps: [volumes]
    cmds:
      # The project's locked Pun once vendor/ exists; the image's Pun installs a fresh clone
      - >-
        {{.APP}} sh -c '[ -x vendor/bin/pun ] && exec vendor/bin/pun "$@" || exec pun "$@"' pun {{.CLI_ARGS}}

  composer:
    desc: Run a Composer command or script (task composer -- qa)
    deps: [volumes]
    cmds:
      - "{{.APP}} composer {{.CLI_ARGS}}"

  bun:
    desc: Run any Bun command (task bun -- add -d vitest)
    deps: [volumes]
    cmds:
      - "{{.APP}} bun {{.CLI_ARGS}}"

  shell:
    desc: Open a shell in the app container
    deps: [volumes]
    cmds:
      - "{{.APP}} bash"

  build:dev:
    desc: Rebuild the dev image with the newest PHP, Composer, Pun and Bun
    cmds:
      - "{{.COMPOSE}} build --pull --no-cache app"

  build:
    desc: Build the production Docker image
    cmds:
      - docker build -t {{regexReplaceAll "[^a-z0-9_.-]" (lower (base .ROOT_DIR)) ""}} .
