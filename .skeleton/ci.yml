name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only builds and tests
permissions:
  contents: read

jobs:
  check:
    name: Format, Analyse & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Dependabot bumps PHP in .devcontainer/Dockerfile but cannot read the FrankenPHP tag in Dockerfile
      # (1-php8.5-trixie), so a PHP bump needs that line changed by hand. This makes sure it is not forgotten.
      - name: PHP versions match
        run: |
          dev=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+).*/\1/p' .devcontainer/Dockerfile)
          prod=$(sed -nE 's/^FROM dunglas\/frankenphp:[0-9]+-php([0-9]+\.[0-9]+).*/\1/p' Dockerfile)
          if [ -z "$dev" ] || [ "$dev" != "$prod" ]; then
            echo "::error file=Dockerfile::PHP is '$dev' in .devcontainer/Dockerfile but '$prod' in Dockerfile. Change the first FROM line in Dockerfile to: FROM dunglas/frankenphp:1-php$dev-trixie AS base"
            exit 1
          fi

      # The same image, database and commands as `task check`, so CI and local runs can't drift apart
      - name: Create Cache Volumes
        run: docker volume create php_composer && docker volume create bun_cache

      - name: Check
        run: |
          docker compose -f .devcontainer/docker-compose.yml run --rm app sh -euc '
            # The repository belongs to the runner user, the container runs as root
            git config --global --add safe.directory "$PWD"
            composer install --no-interaction --no-progress
            if [ -f package.json ]; then bun install --frozen-lockfile && bun run build; fi
            composer qa:ci
          '

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Catches problems that only show in the production image (extensions, the frontend build)
      - name: Build Image
        run: docker build .
